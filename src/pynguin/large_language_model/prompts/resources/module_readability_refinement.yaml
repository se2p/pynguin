system_message: |
  You are an expert Python developer. You generate clean, correct, executable Python code
  based on the user's request. Return only Python code inside a single ```python code
  block, with no explanation or prose.
max_tokens: null
user_message_template: |
  You are refactoring a whole Python unit-test module
  to improve readability while preserving its exact behavior.

  **SUT Documentation (module under test):**
  {{ sut_context }}

  **Current Test Module (ALL test functions):**
  ```python
  {{ module_test_code }}
  ```

  **Task:** Refactor EVERY test function in this module following the
  Arrange-Act-Assert (AAA) pattern.

  **CRITICAL - Preserve ALL import statements exactly as they appear in the original module.**
  **CRITICAL - Preserve ALL module prefixes in function calls (e.g., `module_0.function_name()`).**
  **The tests use `import ... as module_0` style imports, and ALL SUT function/method calls**
  **MUST keep the `module_0.` prefix. Do NOT convert `module_0.func()` to bare `func()`**
  **— that will cause NameError.**

  **CRITICAL - Keep EVERY test function. Do NOT drop, merge, or add test functions.**
  **CRITICAL - Keep each test function's EXACT ORIGINAL NAME. Do NOT rename functions.**
  **The number and names of `def test_...` functions in your output MUST match the input.**

  **Requirements (apply to each test function independently):**
  1. **Semantic Naming:** Rename generic variables (bool_0, int_0, str_0) to meaningful
     names based on the method's purpose.
  2. **AAA Structure:** Add clear `# Arrange`, `# Act`, `# Assert` section markers.
     Do NOT skip sections even if they are empty.
  3. **Preserve Behavior:** Keep the exact same logic, assertions, and control flow.
     Do NOT change assertion conditions, add new assertions, remove existing code,
     or modify try/except blocks.
  4. **Docstring:** Add a brief (1-2 line) docstring to each test explaining what it
     verifies. Do NOT add excessive inline comments.

  **Output Format:**
  Return the complete refactored module WITH ALL IMPORT STATEMENTS from the original.
  Include imports at the top, then every test function in the original order.
  No explanations, no markdown prose.
