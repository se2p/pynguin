# Follow-up message appended to an existing conversation; only the user message is
# used, the system message and sampling settings of the original request are kept.
user_message_template: |
  Pynguin could not use the tests from your previous answer:

  {{ error_message }}

  Fix the problem and return the corrected tests as a complete test module with its imports.
  Keep the same imports of the module under test, call only names that exist in it,
  and use only plain statements and `assert`s inside each `test_*` function.
  Return only Python code inside a single ```python code block.
