system_message: |
  You are an expert Python developer. You generate clean, correct, executable Python code
  based on the user's request. Return only Python code inside a single ```python code
  block, with no explanation or prose.
max_tokens: null
user_message_template: |
  You are a test assertion expert.
  Your task is to add meaningful assertions to EVERY test function in a whole unit-test
  module, based on the module's documented behavior.

  **SUT Documentation (module under test):**
  {{ sut_context }}

  **Current Test Module (ALL test functions):**
  ```python
  {{ module_test_code }}
  ```

  **CRITICAL: You MUST preserve ALL import statements from the input module.**
  **CRITICAL: Preserve ALL module prefixes in function calls (e.g., `module_0.function_name()`).**
  **Do NOT remove the `module_0.` prefix — that will cause NameError.**

  **CRITICAL - Keep EVERY test function. Do NOT drop, merge, or add test functions.**
  **CRITICAL - Keep each test function's exact name and signature as given in the input module (do not rename them again).**
  **The number and names of `def test_...` functions in your output MUST match the input.**

  **Critical Rules (apply to each test function independently):**

  1. **Understand each method's contract from the documentation** — identify the return
     type and any special behaviors or edge cases.

  2. **Handling Expected Exceptions (Negative Testing):**
     Analyse the test inputs to decide whether a test is a NEGATIVE test (expects failure).
     - For NEGATIVE tests: wrap the call in `with pytest.raises(Exception):`.
     - For POSITIVE tests: remove try/except, store the result and assert on it.

  3. **Prefer Concrete Value Equality Over Type Checks:**
     - Prefer concrete value equality (`assert result == <expected_value>`) whenever the expected output is deterministic or can be inferred from inputs, documentation, or behavior.
     - Discourage vacuous or coarse checks (like `isinstance(result, str)` or `len(result) > 0`) unless the exact value is truly non-deterministic (e.g. random timestamps or UUIDs).
     - For collection returns (`list`, `dict`, `set`), assert exact contents or key-value mappings rather than only checking `len(result) > 0`.
     - For boolean returns, assert `assert result is True` or `assert result is False` rather than just `isinstance(result, bool)`.

  4. **Verify Object State & Side Effects:**
     - If the method under test modifies object attributes or internal state, assert the state of those attributes after calling the method (e.g. `assert obj.attribute == expected_value`).
     - If the method updates collections, registries, or class variables, verify the updated entries.
     - Do not leave state-modifying calls unverified even if they return `None`.

  5. **Preserve ALL existing code and AAA structure:**
     - Keep the test function name and signature unchanged.
     - Keep the `# Arrange` section unchanged.
     - Keep the `# Act` section unchanged (unless converting try/except to pytest.raises).
     - Keep variable names unchanged.
     - Only add/modify assertions in the `# Assert` section.
     - Never remove the AAA comment markers.

  **Output Format:**
  Return the complete module with ALL import statements and ALL test functions
  preserved, in the original order. Start with import statements, then the test functions.
  Do NOT change function names, variable names, or the Arrange sections.
  No explanations, no markdown prose.
