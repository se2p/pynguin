user_message_template: |
  ### Task
  Pynguin failed to cover the following callables. Write additional pytest tests that
  specifically exercise them, covering their statements and branches.

  ### Uncovered callables
  {% for target in uncovered_targets -%}
  {{ target }}
  {% endfor %}
  ### Instructions
  - Use pytest only; do not use the `unittest` module.
  - Derive imports from the module path: for `a/b/c.py`, import via `from a.b.c import ...`.
  - Focus each test on reaching an uncovered callable and its branches.
  - Only wrap calls in `with pytest.raises(...)` when the callable actually raises or
    propagates an uncaught exception. If the callable catches, suppresses, or logs the
    exception internally (handling it without re-raising), invoke the callable directly
    without `pytest.raises`.
  - When a callable has a `[hint: ...]` note, use it: it diagnoses why the search could
    not cover the callable (e.g. it was never reached, or a branch only took one
    outcome). Address the hint directly — construct valid inputs to reach it, or vary
    one input/state axis to flip an unobserved branch.
  - Write test functions named `test_<callable>_<scenario>`.
  - When testing class properties, descriptors, or callables that require a dummy class,
    do not define module-level or nested `class` statements. Instead, create classes
    dynamically inside the test function using `type('ClassName', (), {'attr': value})`,
    or for dataclasses use `from dataclasses import make_dataclass; Cls = make_dataclass('Cls', [('field', type)])`.
    Keep tests flat and self-contained.
  {% if visibility_instructions -%}
  - {{ visibility_instructions }}
  {% endif %}

  ### Module under test
  - Module path: `{{ module_path }}`
  - Module source code:
  ```python
  {{ module_code }}
  ```

  ### Output
  Return only the new tests as a single ```python code block.
