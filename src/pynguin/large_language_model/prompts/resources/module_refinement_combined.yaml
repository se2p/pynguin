system_message: |
  You are an expert Python developer. You generate clean, correct, executable Python code
  based on the user's request. Return only Python code inside a single ```python code
  block, with no explanation or prose.
max_tokens: null
user_message_template: |
  You are refining a whole Python unit-test module in a SINGLE pass: improve readability
  AND add meaningful assertions to EVERY test function, while preserving behavior.

  **SUT Documentation (module under test):**
  {{ sut_context }}

  **Current Test Module (ALL test functions):**
  ```python
  {{ module_test_code }}
  ```

  **CRITICAL: You MUST preserve ALL import statements from the input module.**
  **CRITICAL: Preserve ALL module prefixes in function calls (e.g., `module_0.function_name()`).**
  **Do NOT remove the `module_0.` prefix — that will cause NameError.**

  **CRITICAL - Keep EVERY test function in the original order. Do NOT drop, merge, or add test functions.**
  **The number of `def test_...` functions in your output MUST match the input.**

  **Do BOTH of the following for each test function independently:**

  **A) Readability**
  1. Rename each test function to be descriptive of what it tests (use pattern: `test_<behavior_being_tested>`). Ensure all test function names start with `test_` and are unique.
  2. Rename generic variables (bool_0, int_0, str_0) to meaningful names.
  3. Add clear `# Arrange`, `# Act`, `# Assert` section markers (do not skip empty ones).
  4. Add a brief (1-2 line) docstring explaining what the test verifies.
  5. Keep the exact same logic and control flow.

  **B) Assertions**
  1. Decide from the inputs whether each test is POSITIVE or NEGATIVE.
     - NEGATIVE: wrap the call in `with pytest.raises(Exception):`.
     - POSITIVE: remove try/except, store the result and add assertions.
       - Prefer concrete value equality (`assert result == <expected_value>`) whenever the expected output is deterministic or can be inferred from inputs, documentation, or behavior over coarse checks (like `isinstance(result, str)` or `len(result) > 0`) unless non-deterministic.
       - If the method modifies object attributes, collections, or internal state, verify that modified state explicitly (e.g. `assert obj.attribute == expected_value`).
  2. Only add/modify assertions in the `# Assert` section; do not weaken existing checks.

  **Output Format:**
  Return the complete refined module WITH ALL IMPORT STATEMENTS from the original.
  Include imports at the top, then every test function in the original order, each with its
  descriptive test function name. No explanations, no markdown prose.
